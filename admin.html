body{background:#000;color:#fff;font-family:Arial;padding-bottom:70px}

.movie{background:#111;border-radius:10px;overflow:hidden;border:1px solid #222;cursor:pointer;position:relative}
.movie img{width:100%;height:160px;object-fit:cover;background:#222}

.movie .db{position:absolute;top:5px;right:5px;background:#ffcc00;color:#000;font-size:7px;padding:3px 5px;border-radius:8px;font-weight:bold}

.movie h3{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:14px}
.movie p{font-size:8px;color:#888;margin:2px 0}
.movie .btns{display:flex;gap:3px;padding:4px}
.movie .btns button{flex:1;padding:5px 0;border-radius:12px;border:none;font-size:9px;font-weight:bold;cursor:pointer}
.btnPlay{background:#ff2a00;color:#fff}
.btnDL{background:#00c853;color:#fff}
.player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;display:none;flex-direction:column}
.prov{display:flex;gap:5px;padding:8px;background:#111;overflow-x:auto}
.prov button{padding:7px 11px;border-radius:15px;border:1px solid #333;background:#222;color:#fff;font-size:10px;white-space:nowrap}
.prov button.active{background:#ff2a00}
.player iframe{flex:1;border:none}
.ctrl{display:flex;gap:6px;padding:10px;background:#111;justify-content:center;flex-wrap:wrap}
.ctrl button{padding:9px 15px;border-radius:20px;border:none;font-weight:bold;font-size:11px;cursor:pointer}

let cur=[...DATA],curr=null;
function render(){
 document.getElementById('movies').innerHTML=cur.slice(0,300).map(m=>`<div class="movie">
 <div class="badge">${m.c.toUpperCase()}</div>${m.c==='db'?'<div class="db">🐉 DB</div>':''}
 <img src="${m.img}" loading="lazy" onclick="playM('${m.t.replace(/'/g,"")}','${m.id}','${m.c}')" onerror="this.src='https://via.placeholder.com/200x300/ff2a00/fff?text=${encodeURIComponent(m.t)}'">
 <div class="info"><h3>${m.t}</h3><p>${m.y} • Complete</p></div>
 <div class="btns">
 <button class="btnPlay" onclick="playM('${m.t.replace(/'/g,"")}','${m.id}','${m.c}')">▶ Play</button>
 <button class="btnDL" onclick="downloadHome('${m.t.replace(/'/g,"")}','${m.id}','${m.c}')">⬇ DL</button>
 </div>
 </div>`).join('');
 document.getElementById('status').innerText=`FINAL: ${cur.length} Titles • Play + Download on Home Page ✅ MovieBox + Dragon Ball + Anime`;
}
function doSearch(){
 let q=document.getElementById('search').value.toLowerCase().trim();
 cur=q?DATA.filter(m=>m.t.toLowerCase().includes(q)):[...DATA];
 render();
}
function filterCat(c,b){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');
 if(c==='all')cur=[...DATA];else cur=DATA.filter(m=>m.c===c);
 render();
}
function getProv(m){
 let type=(m.c==='tv'||m.c==='anime'||m.c==='db')?'tv':'movie';
 return[
  {n:"VidSrc TO ▶",u:`https://vidsrc.to/embed/${type}/${m.id}`},
  {n:"Embed SU ⭐ DL",u:`https://embed.su/embed/${type}/${m.id}`},
  {n:"VidSrc ME ▶",u:`https://vidsrc.me/embed/${m.id}`}
 ];
}
function playM(t,id,c){curr={t,id,c};document.getElementById('pTitle').innerText=t;document.getElementById('player').style.display='flex';let p=getProv(curr);document.getElementById('provBtns').innerHTML=p.map((x,i)=>`<button id="pb${i}" class="${i===0?'active':''}" onclick="switchP(${i})">${x.n}</button>`).join('');document.getElementById('pFrame').src=p[0].u}
function switchP(i){document.querySelectorAll('#provBtns button').forEach(b=>b.classList.remove('active'));document.getElementById('pb'+i).classList.add('active');document.getElementById('pFrame').src=getProv(curr)[i].u}
function closeP(){document.getElementById('player').style.display='none';document.getElementById('pFrame').src='';}
function downloadHome(t,id,c){
 let type=(c==='tv'||c==='anime'||c==='db')?'tv':'movie';
 if(confirm(`⬇ Download ${t}?\n\nOK = Open Download Page\nCancel = Play then download inside player`)){
   window.open(`https://embed.su/embed/${type}/${id}`,'_blank');
 }else{
   playM(t,id,c);
 }
}
function doDownload(){
 if(!curr)return alert('Select movie first');
 downloadHome(curr.t,curr.id,curr.c);
}
render();
