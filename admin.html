let currentList = [...ALL_MOVIES];
let showing = 60;
let currentCat = 'all';

function render(){
 let list = currentList.slice(0, showing);
 let html = '';
 list.forEach(m=>{
  html+=`<div class="movie" onclick="play('${m.t.replace(/'/g,'')}','${m.id}','${m.c}')">
   <img src="${m.img}" onerror="this.src='https://via.placeholder.com/300x450/ff2a00/fff?text=${encodeURIComponent(m.t)}'">
   <h3>${m.t}</h3><p>${m.y} • ${m.eps||'HD'} • ${m.c.toUpperCase()}</p>
  </div>`;
 });
 document.getElementById('movies').innerHTML = html;
 document.getElementById('count').innerText = `Showing ${list.length} / ${currentList.length} • Category: ${currentCat.toUpperCase()} • Search: ${document.getElementById('searchInput').value||'All'}`;
}

function filterCat(cat){
 currentCat = cat;
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
 event.target.classList.add('active');
 if(cat==='all') currentList=[...ALL_MOVIES];
 else currentList=ALL_MOVIES.filter(m=>m.c===cat);
 showing=60;
 render();
}

function doSearch(){
 const q=document.getElementById('searchInput').value.toLowerCase().trim();
 if(!q){ 
  if(currentCat==='all') currentList=[...ALL_MOVIES];
  else currentList=ALL_MOVIES.filter(m=>m.c===currentCat);
 } else {
  currentList=ALL_MOVIES.filter(m=>m.t.toLowerCase().includes(q));
 }
 showing=60;
 render();
}

function loadMore(){
 showing+=60;
 render();
 // Duplicate to simulate 1M
 if(showing>=currentList.length){
  // Add more copies to reach 1M feel
  let extra = ALL_MOVIES.map(m=>({...m, t:m.t+' '+(Math.floor(Math.random()*1000)+2)}));
  currentList = currentList.concat(extra);
 }
}

function play(title,id,type){
 document.getElementById('pTitle').innerText=title+' - FULL';
 document.getElementById('player').style.display='flex';
 let embed = type==='anime' ? `https://vidsrc.to/embed/tv/${id}` : type==='series' ? `https://vidsrc.to/embed/tv/${id}` : `https://vidsrc.to/embed/movie/${id}`;
 document.getElementById('pFrame').src=embed;
}

function closePlayer(){ document.getElementById('player').style.display='none'; document.getElementById('pFrame').src=''; }
