<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RAXTES ADMIN</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050505;color:white;font-family:Arial;padding:20px}.header{background:#111;padding:15px;border-radius:10px;display:flex;justify-content:space-between;border:1px solid #ff2a00;margin-bottom:20px}.logo{color:#ff2a00;font-size:22px;font-weight:bold}.login-box{max-width:400px;margin:80px auto;background:#111;padding:30px;border-radius:15px;border:1px solid #ff2a00;text-align:center}.input{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:1px solid #333;background:#222;color:white}.btn{background:#ff2a00;color:white;padding:12px 25px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:20px}.card-stat{background:#111;padding:20px;border-radius:12px;border:1px solid #222;text-align:center}.card-stat h2{color:#ff2a00;font-size:28px}.table-wrap{background:#111;border-radius:12px;padding:15px;overflow-x:auto;border:1px solid #222}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#222;padding:10px;color:#ff2a00}td{padding:10px;border-bottom:1px solid #222}.hidden{display:none}</style></head><body><div id="loginScreen" class="login-box"><div style="font-size:40px">🔐</div><h2 style="color:#ff2a00;margin:15px 0">RAXTES ADMIN v6</h2><input class="input" id="adminPass" type="password" placeholder="Password: RAXTES2026ADMIN"><button class="btn" onclick="login()">Login</button></div><div id="adminPanel" class="hidden"><div class="header"><div class="logo">RAXTES ADMIN v6</div><button class="btn" style="width:auto" onclick="logout()">Logout</button></div><div class="stats"><div class="card-stat"><h2 id="totalUsers">0</h2><p>Users</p></div><div class="card-stat"><h2 id="totalSubs">$0</h2><p>Revenue $9</p></div><div class="card-stat"><h2 id="totalDevices">0</h2><p>Devices</p></div><div class="card-stat"><h2 id="totalDownloads">0</h2><p>Downloads</p></div></div><div class="table-wrap"><h3>Subscribers</h3><table><thead><tr><th>User</th><th>Country</th><th>Devices</th><th>Downloads</th></tr></thead><tbody id="usersTable"></tbody></table><button class="btn" style="width:auto;margin-top:15px" onclick="addTestUser()">+ Test User</button></div></div><script>const P="RAXTES2026ADMIN";function login(){if(document.getElementById('adminPass').value===P){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('adminPanel').classList.remove('hidden');localStorage.setItem('raxtes_admin_login','true');loadAdmin()}else alert('Wrong!')}function logout(){localStorage.removeItem('raxtes_admin_login');location.reload()}if(localStorage.getItem('raxtes_admin_login')==='true'){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('adminPanel').classList.remove('hidden')}function loadAdmin(){let u=JSON.parse(localStorage.getItem('raxtes_admin_users')||'[]');document.getElementById('totalUsers').textContent=u.length;document.getElementById('totalSubs').textContent='$'+(u.length*9);document.getElementById('totalDevices').textContent=u.reduce((a,x)=>a+x.devices.length,0);document.getElementById('totalDownloads').textContent=u.reduce((a,x)=>a+x.downloads,0);const b=document.getElementById('usersTable');b.textContent='';u.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${x.id}</td><td>${x.country}</td><td>${x.devices.join(',')} (${x.devices.length}/3)</td><td>${x.downloads}</td>`;b.appendChild(tr)})}function addTestUser(){let u=JSON.parse(localStorage.getItem('raxtes_admin_users')||'[]');u.push({id:'USER-'+Math.floor(Math.random()*9000+1000),country:'USA',devices:['Phone','TV'],downloads:5});localStorage.setItem('raxtes_admin_users',JSON.stringify(u));loadAdmin()}loadAdmin();</script></body></html>
