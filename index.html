<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RAXTES v25 FINAL</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e1a;color:#fff;font-family:Arial;padding-bottom:80px}.topBar{background:#0a0e1a;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9999;border-bottom:1px solid #1a2236}.searchBar{background:#1a2236;border-radius:25px;padding:10px 18px;display:flex;align-items:center;gap:10px;margin:12px 15px}.searchBar input{flex:1;background:transparent;border:none;color:#fff;outline:none}.tabs{display:flex;gap:8px;padding:10px 15px;overflow-x:auto}.tab{padding:8px 16px;border-radius:20px;background:#1a2236;color:#888;border:1px solid #1a2236;white-space:nowrap;font-size:12px;cursor:pointer}.tab.active{background:#fff;color:#000;font-weight:900}.cat{padding:15px 0 0 15px}.catHead{display:flex;justify-content:space-between;padding-right:15px;margin-bottom:10px}.hScroll{display:flex;gap:12px;overflow-x:auto;padding:0 15px 15px 0}.card{min-width:130px;width:130px;background:#111a2e;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #1a2236}.card img{width:100%;height:185px;object-fit:cover}.card .info{padding:8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.downloadsPage{display:none;padding:15px}.dlItem{display:flex;gap:12px;background:#111a2e;border-radius:12px;padding:10px;margin-bottom:10px;border:1px solid #1a2236;align-items:center}.dlItem img{width:90px;height:55px;border-radius:8px;object-fit:cover}.dlInfo{flex:1}.progress{height:4px;background:#0a0e1a;border-radius:4px;overflow:hidden;margin-top:6px}.progress .fill{height:100%;background:linear-gradient(90deg,#00e676,#00c853)}.btnPlayDL{background:linear-gradient(90deg,#00e676,#00e5ff);color:#000;border:none;padding:8px 18px;border-radius:20px;font-weight:900;font-size:11px;cursor:pointer}.bottomNav{position:fixed;bottom:0;left:0;width:100%;background:#111a2e;border-top:1px solid #1a2236;display:flex;justify-content:space-around;padding:10px 0;z-index:9999}.navItem{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:#888;font-size:10px}.navItem.active{color:#fff}.player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;display:none;flex-direction:column}.playerTop{padding:12px;background:#0a0e1a;display:flex;justify-content:space-between;align-items:center}.vidWrap{position:relative;background:#000;width:100%;aspect-ratio:16/9}.vidWrap iframe{width:100%;height:100%;border:none}.qualBar{display:flex;gap:8px;padding:12px;background:#0a0e1a;overflow-x:auto;border-bottom:1px solid #1a2236}.qualBar button{padding:8px 14px;border-radius:20px;border:1px solid #1a2236;background:#1a2236;color:#fff;font-size:11px;white-space:nowrap;cursor:pointer}.qualBar button.active{background:#00e676;color:#000}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:100000;display:none;align-items:center;justify-content:center;padding:20px}.modalBox{background:#111a2e;border:1px solid #1a2236;border-radius:16px;padding:20px;width:100%;max-width:380px}</style></head><body>
<div class="topBar"><div>▶ RAXTES Box</div><div>🔍 ⬇ 👤</div></div>
<div class="searchBar"><span>🔍</span><input id="search" placeholder="Search..." oninput="doSearch()"></div>
<div class="tabs"><button class="tab active" onclick="showHome()">Home</button><button class="tab" onclick="showDownloads()">Downloads <span id="dlCount" style="background:#00e676;color:#000;border-radius:10px;padding:2px 6px;font-size:9px">0</span></button><button class="tab" onclick="filterCat('db')">Dragon Ball</button><button class="tab" onclick="filterCat('anime')">Anime</button></div>
<div id="homePage"><div id="categories"></div></div>
<div id="downloadsPage" class="downloadsPage"><div style="display:flex;gap:8px;margin-bottom:15px"><button class="tab active">MovieBox 3</button><button class="tab">Local files <span id="localCount">0</span></button><button class="tab">Received</button></div><div id="dlList"></div></div>
<div class="bottomNav"><div class="navItem active" onclick="showHome()"><div>🏠</div><div>Home</div></div><div class="navItem" onclick="showDownloads()"><div>⬇</div><div>Downloads</div></div><div class="navItem" onclick="filterCat('movie')"><div>🎬</div><div>Movie</div></div><div class="navItem"><div>👤</div><div>Me</div></div></div>
<div id="player" class="player"><div class="playerTop"><span id="pTitle" style="font-weight:900;flex:1"></span><button onclick="closeP()" style="background:#1a2236;border:none;color:#fff;padding:8px 14px;border-radius:20px">✕</button></div><div class="vidWrap"><iframe id="pFrame" allowfullscreen></iframe></div><div class="qualBar"><button onclick="setQual('360p',this)">360P Free</button><button onclick="setQual('480p',this)">480P Free</button><button class="active" onclick="setQual('720p',this)">720P Premium</button><button onclick="setQual('1080p',this)">1080P Premium</button></div><div style="display:flex;gap:10px;padding:15px;background:#0a0e1a"><button onclick="downloadQuality()" style="background:#00e676;color:#000;flex:1;padding:12px;border-radius:25px;border:none;font-weight:900">⬇ Download <span id="qualLabel">720p</span></button><button onclick="closeP()" style="background:#1a2236;color:#fff;border:1px solid #2a3a5a;flex:1;padding:12px;border-radius:25px">Close</button></div></div>
<div id="premiumModal" class="modal"><div class="modalBox"><h3 style="color:#00e676">🔒 Premium 720p-1080p</h3><p style="font-size:12px;color:#888;margin:10px 0">Subscribe to download 720p & 1080p to internal storage. 360p/480p free.</p><input id="subEmail" placeholder="Email" style="width:100%;padding:12px;border-radius:10px;border:1px solid #1a2236;background:#0a0e1a;color:#fff;margin:8px 0"><button onclick="subscribe()" style="width:100%;background:#00e676;color:#000;padding:12px;border-radius:25px;border:none;font-weight:900">💳 Subscribe $3</button><button onclick="document.getElementById('premiumModal').style.display='none'" style="width:100%;background:#1a2236;color:#fff;padding:10px;border-radius:25px;border:1px solid #2a3a5a;margin-top:8px">Use Free 360p</button></div></div>
<script>
const DATA=[{t:"Hellfire 1080P",c:"movie",id:"299534",y:2024,img:"https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg",size:"871MB"},{t:"Peaky Blinders 360P",c:"tv",id:"60574",y:2024,img:"https://via.placeholder.com/300x450/1a2236/fff?text=PEAKY",size:"188MB"},{t:"Shelter 1080P",c:"movie",id:"76600",y:2024,img:"https://image.tmdb.org/t/p/w500/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg",size:"957MB"},{t:"Dragon Ball Super Beerus",c:"db",id:"149871",y:2013,img:"https://via.placeholder.com/300x450/ff2a00/fff?text=BEERUS",size:"1.2GB"},{t:"Dragon Ball Broly",c:"db",id:"503314",y:2018,img:"https://via.placeholder.com/300x450/ff6a00/fff?text=BROLY",size:"1.5GB"},{t:"One Piece",c:"anime",id:"37854",y:1999,img:"https://image.tmdb.org/t/p/w500/cMD9YUzK.jpg",size:"450MB"}];
let curr=null,curQual='720p',downloads=JSON.parse(localStorage.getItem('raxtes_dls')||'[]'),isPremium=localStorage.getItem('raxtes_premium')==='yes';
function renderHome(){let html='';let cats=[{n:"Epic Fantasy",f:m=>m.c==='tv'},{n:"Dragon Ball",f:m=>m.c==='db'},{n:"Anime Top",f:m=>m.c==='anime'},{n:"Action Movies",f:m=>m.c==='movie'}];cats.forEach(cat=>{let movies=DATA.filter(cat.f);html+=`<div class="cat"><div class="catHead"><h3>${cat.n}</h3><a style="color:#888;font-size:12px">All ></a></div><div class="hScroll">`;movies.forEach(m=>{html+=`<div class="card" onclick="playM('${m.t.replace(/'/g,"")}','${m.id}','${m.c}')"><img src="${m.img}"><div class="info">${m.t}<br><span style="color:#00e676">${m.size}</span></div></div>`});html+=`</div></div>`});document.getElementById('categories').innerHTML=html;}
function showHome(){document.getElementById('homePage').style.display='block';document.getElementById('downloadsPage').style.display='none';}
function showDownloads(){document.getElementById('homePage').style.display='none';document.getElementById('downloadsPage').style.display='block';renderDownloads();}
function filterCat(c){let f=DATA.filter(m=>m.c===c);let html=`<div class="cat"><div class="catHead"><h3>${c.toUpperCase()}</h3></div><div class="hScroll">`;f.forEach(m=>{html+=`<div class="card" onclick="playM('${m.t.replace(/'/g,"")}','${m.id}','${m.c}')"><img src="${m.img}"><div class="info">${m.t}</div></div>`});html+=`</div></div>`;document.getElementById('categories').innerHTML=html;showHome();}
function getProv(m){let type=(m.c==='tv'||m.c==='anime'||m.c==='db')?'tv':'movie';return[{u:`https://vidsrc.to/embed/${type}/${m.id}`}];}
function playM(t,id,c){curr={t,id,c,data:DATA.find(x=>x.id===id)||{}};document.getElementById('pTitle').innerText=t;document.getElementById('player').style.display='flex';document.getElementById('pFrame').src=getProv(curr)[0].u;}
function closeP(){document.getElementById('player').style.display='none';document.getElementById('pFrame').src='';}
function setQual(q,btn){curQual=q;document.querySelectorAll('.qualBar button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('qualLabel').innerText=q;if((q==='720p'||q==='1080p')&&!isPremium){document.getElementById('premiumModal').style.display='flex';}}
function downloadQuality(){if(!curr)return;if((curQual==='720p'||curQual==='1080p')&&!isPremium){document.getElementById('premiumModal').style.display='flex';return;}let dl={t:curr.t,id:curr.id,qual:curQual,size:curQual==='1080p'?'1.2GB':'800MB',progress:97,img:curr.data.img||'',status:'Finished'};downloads.unshift(dl);localStorage.setItem('raxtes_dls',JSON.stringify(downloads));alert(`⬇ ${curr.t} ${curQual} saved to Internal Storage`);renderDownloads();showDownloads();}
function renderDownloads(){document.getElementById('dlCount').innerText=downloads.length;document.getElementById('localCount').innerText=downloads.length;document.getElementById('dlList').innerHTML=downloads.map(d=>`<div class="dlItem"><img src="${d.img}"><div class="dlInfo"><div style="font-size:12px;font-weight:900">${d.qual.toUpperCase()} ${d.t}</div><div style="font-size:10px;color:#888">${d.size} • ${d.status}</div><div class="progress"><div class="fill" style="width:${d.progress}%"></div></div></div><button class="btnPlayDL" onclick="playM('${d.t.replace(/'/g,"")}','${d.id}','movie')">Play</button></div>`).join('')||'<div style="text-align:center;padding:40px;color:#888">No downloads yet</div>';}
function subscribe(){let e=document.getElementById('subEmail').value;if(!e){alert('Enter email');return;}isPremium=true;localStorage.setItem('raxtes_premium','yes');document.getElementById('premiumModal').style.display='none';alert('Premium Active! 720p-1080p unlocked');}
function doSearch(){let q=document.getElementById('search').value.toLowerCase();if(!q){renderHome();return;}let f=DATA.filter(m=>m.t.toLowerCase().includes(q));let html=`<div class="cat"><div class="catHead"><h3>Search ${q}</h3></div><div class="hScroll">`;f.forEach(m=>{html+=`<div class="card" onclick="playM('${m.t.replace(/'/g,"")}','${m.id}','${m.c}')"><img src="${m.img}"><div class="info">${m.t}</div></div>`});html+=`</div></div>`;document.getElementById('categories').innerHTML=html;}
renderHome();renderDownloads();
</script></body></html>
