<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RAXTES v29 UGANDA FIX</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e1a;color:#fff;font-family:Arial;padding-bottom:80px}.topBar{background:#0a0e1a;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9999;border-bottom:1px solid #1a2236}.searchBar{background:#1a2236;border-radius:25px;padding:10px 18px;display:flex;align-items:center;gap:10px;margin:12px 15px}.searchBar input{flex:1;background:transparent;border:none;color:#fff;outline:none}.tabs{display:flex;gap:8px;padding:10px 15px;overflow-x:auto}.tab{padding:8px 16px;border-radius:20px;background:#1a2236;color:#888;border:1px solid #1a2236;white-space:nowrap;font-size:12px;cursor:pointer}.tab.active{background:#fff;color:#000;font-weight:900}.cat{padding:15px 0 0 15px}.hScroll{display:flex;gap:12px;overflow-x:auto;padding:0 15px 15px 0}.card{min-width:135px;width:135px;background:#111a2e;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #1a2236;flex-shrink:0}.card img{width:100%;height:190px;object-fit:cover}.card .info{padding:8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dlPage{display:none;padding:15px}.dlItem{display:flex;gap:12px;background:#111a2e;border-radius:12px;padding:10px;margin-bottom:10px;border:1px solid #1a2236;align-items:center}.bottomNav{position:fixed;bottom:0;left:0;width:100%;background:#111a2e;border-top:1px solid #1a2236;display:flex;justify-content:space-around;padding:10px 0;z-index:9999}.navItem{color:#888;font-size:10px;cursor:pointer}.navItem.active{color:#fff}.player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;display:none;flex-direction:column}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:100000;display:none;align-items:center;justify-content:center;padding:20px}.modalBox{background:#111a2e;border:1px solid #1a2236;border-radius:16px;padding:20px;width:100%;max-width:400px}</style></head><body>
<div class="topBar"><div style="font-weight:900">▶ RAXTES <span style="color:#00e676">Box</span></div><div style="font-size:10px;background:#00e676;color:#000;padding:4px 8px;border-radius:10px">v29 UGANDA WORKING</div></div>
<div class="searchBar"><span>🔍</span><input id="search" placeholder="Search movies, anime..." oninput="doSearch()"></div>
<div class="tabs"><button class="tab active" id="tabHome" onclick="showHome()">Home</button><button class="tab" id="tabDL" onclick="showDownloads()">Downloads <span id="dlCount" style="background:#00e676;color:#000;border-radius:10px;padding:2px 6px;font-size:9px">0</span></button><button class="tab" onclick="filterCat('db')">Dragon Ball</button><button class="tab" onclick="filterCat('anime')">Anime</button><button class="tab" onclick="filterCat('movie')">Movies</button></div>
<div id="homePage"><div id="categories"></div></div>
<div id="downloadsPage" class="dlPage"><div id="dlList"></div></div>
<div class="bottomNav"><div class="navItem active" id="navHome" onclick="showHome()">🏠 Home</div><div class="navItem" id="navDL" onclick="showDownloads()">⬇ Downloads</div><div class="navItem" onclick="filterCat('movie')">🎬 Movie</div><div class="navItem">👤 Me</div></div>

<div id="player" class="player">
<div style="padding:12px;background:#0a0e1a;display:flex;justify-content:space-between;align-items:center"><span id="pTitle" style="font-weight:900;flex:1;font-size:14px"></span><button onclick="closeP()" style="background:#1a2236;border:none;color:#fff;padding:8px 14px;border-radius:20px">✕</button></div>
<div style="position:relative;background:#000;width:100%;aspect-ratio:16/9"><iframe id="pFrame" allowfullscreen allow="autoplay; encrypted-media; fullscreen" style="width:100%;height:100%;border:none;background:#000"></iframe></div>

<div style="display:flex;gap:6px;padding:10px;background:#0a0e1a;overflow-x:auto;border-bottom:1px solid #1a2236" id="provBar">
<button class="tab active" onclick="switchProv(0,this)">▶ Server 1 vidlink - WORKS UG</button>
<button class="tab" onclick="switchProv(1,this)">▶ Server 2 vidsrc.cc - WORKS</button>
<button class="tab" onclick="switchProv(2,this)">▶ Server 3 embed.su HD</button>
<button class="tab" onclick="switchProv(3,this)">▶ Server 4 autoembed 4K</button>
</div>

<div style="display:flex;gap:6px;padding:10px;background:#0a0e1a;overflow-x:auto">
<button class="tab" onclick="setQual('360p',this)">360P Free</button>
<button class="tab" onclick="setQual('480p',this)">480P Free</button>
<button class="tab active" onclick="setQual('720p',this)">720P Premium</button>
<button class="tab" onclick="setQual('1080p',this)">1080P Premium</button>
</div>

<div style="display:flex;gap:10px;padding:15px;background:#0a0e1a">
<button onclick="downloadQuality()" style="background:#00e676;color:#000;flex:1;padding:12px;border-radius:25px;border:none;font-weight:900">⬇ Download <span id="qualLabel">720p</span></button>
<button onclick="shareMovie()" style="background:#1a2236;color:#fff;border:1px solid #2a3a5a;flex:1;padding:12px;border-radius:25px">Share</button>
</div>

<div style="padding:12px;background:#111a2e;margin:10px;border-radius:10px;border-left:3px solid #00e676">
<div style="font-size:12px;color:#00e676;font-weight:900">✅ v29 Fixed for Uganda - vidsrc.icu removed (blocked)</div>
<div style="font-size:11px;color:#ccc;margin-top:4px">If video blank, tap Server 2 or 1. vidlink.pro works best in UG. No redirect - Safe.</div>
<div id="status" style="font-size:10px;color:#888;margin-top:4px">Status: Ready</div>
</div>
</div>

<div id="premiumModal" class="modal"><div class="modalBox"><h3 style="color:#00e676">🔒 Premium 720p-1080p</h3><p style="font-size:12px;color:#888;margin:10px 0">360p/480p free. 720p/1080p needs subscription.</p><input id="subEmail" placeholder="Email" style="width:100%;padding:12px;border-radius:10px;border:1px solid #1a2236;background:#0a0e1a;color:#fff;margin:8px 0"><button onclick="payNow()" style="width:100%;background:#00e676;color:#000;padding:14px;border-radius:25px;border:none;font-weight:900;margin-top:8px">💳 Unlock Premium $3</button><button onclick="document.getElementById('premiumModal').style.display='none'" style="width:100%;background:#1a2236;color:#fff;padding:10px;border-radius:25px;border:1px solid #2a3a5a;margin-top:8px">Use Free 360p</button></div></div>

<script>
// BLOCK REDIRECTS BUT ALLOW VIDEO DOMAINS
(function(){
 const allowed=['github.io','vidlink.pro','vidsrc.cc','embed.su','autoembed.co','2embed','vidsrc.to','vidsrc.me','tmdb'];
 const o=window.open;
 window.open=function(u){
  if(!u) return null;
  for(let d of allowed){if(u.includes(d)) return o.call(window,u,'_blank');}
  console.log('Blocked redirect:',u);
  return null;
 };
})();

const DATA=[
{t:"Avengers Endgame",c:"movie",id:"299534",y:2019,img:"https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg",size:"1.4GB"},
{t:"Deadpool & Wolverine",c:"movie",id:"533535",y:2024,img:"https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubf.jpg",size:"1.2GB"},
{t:"Dune Part Two",c:"movie",id:"693134",y:2024,img:"https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg",size:"1.8GB"},
{t:"John Wick 4",c:"movie",id:"603692",y:2023,img:"https://image.tmdb.org/t/p/w500/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg",size:"1.1GB"},
{t:"Spider-Man No Way Home",c:"movie",id:"634649",y:2021,img:"https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg",size:"1.3GB"},
{t:"Dragon Ball Super Super Hero",c:"db",id:"610150",y:2022,img:"https://image.tmdb.org/t/p/w500/rgZ9hML0kF2lLneQKOC07sG2fA.jpg",size:"1.2GB"},
{t:"Dragon Ball Super Broly",c:"db",id:"503314",y:2018,img:"https://image.tmdb.org/t/p/w500/f5uNbUC76oWUEdP45wRhTOJc6m.jpg",size:"1.1GB"},
{t:"One Piece Film Red",c:"anime",id:"820446",y:2022,img:"https://image.tmdb.org/t/p/w500/8hV9BfAO9Tz9Z3Z3Z.jpg",size:"1GB"},
{t:"Demon Slayer Mugen Train",c:"anime",id:"635302",y:2020,img:"https://image.tmdb.org/t/p/w500/h8Rb9gBr48ODIwYUttZNYeMWe.jpg",size:"1.1GB"},
{t:"Jujutsu Kaisen 0",c:"anime",id:"811112",y:2021,img:"https://image.tmdb.org/t/p/w500/3pTwM2EAT8qXlQ9R8c.jpg",size:"950MB"},
];

let curr=null,curQual='720p',downloads=JSON.parse(localStorage.getItem('raxtes_dls')||'[]'),isPremium=localStorage.getItem('raxtes_premium')==='yes';

// NEW PROVIDERS THAT WORK IN UGANDA - No vidsrc.icu
function getProviders(m){
 let id=m.id;
 return [
   `https://vidlink.pro/movie/${id}?primaryColor=00e676&secondaryColor=a2a2a2&iconColor=eefdec&icons=default&player=default&title=true&poster=true&autoplay=true&nextbutton=false`, // WORKS IN UG - BEST
   `https://vidsrc.cc/v2/embed/movie/${id}?autoPlay=true`, // WORKS
   `https://embed.su/embed/movie/${id}`, // HD + Download
   `https://autoembed.co/movie/tmdb/${id}` // Backup 4K
 ];
}

function renderHome(){
 let html='';
 let cats=[{n:"🔥 Movies That Work in Uganda",f:m=>m.c==='movie'},{n:"🐉 Dragon Ball",f:m=>m.c==='db'},{n:"🎌 Anime Working",f:m=>m.c==='anime'}];
 cats.forEach(cat=>{
   let mvs=DATA.filter(cat.f);
   html+=`<div class="cat"><div class="catHead"><h3>${cat.n}</h3></div><div class="hScroll">`;
   mvs.forEach(m=>{
     html+=`<div class="card" onclick="playM('${m.t.replace(/'/g,"")}','${m.id}','${m.c}')"><img src="${m.img}" loading="lazy" onerror="this.src='https://via.placeholder.com/135x190/111a2e/00e676?text=${encodeURIComponent(m.t.substring(0,10))}'"><div class="info">${m.t}<br><span style="color:#00e676">▶ ${m.size} • Tap Play</span></div></div>`;
   });
   html+=`</div></div>`;
 });
 document.getElementById('categories').innerHTML=html;
}

function showHome(){document.getElementById('homePage').style.display='block';document.getElementById('downloadsPage').style.display='none';document.getElementById('tabHome').classList.add('active');document.getElementById('tabDL').classList.remove('active');}
function showDownloads(){document.getElementById('homePage').style.display='none';document.getElementById('downloadsPage').style.display='block';document.getElementById('tabDL').classList.add('active');document.getElementById('tabHome').classList.remove('active');renderDownloads();}
function filterCat(c){let f=DATA.filter(m=>m.c===c);let html=`<div class="cat"><div class="catHead"><h3>${c.toUpperCase()}</h3></div><div class="hScroll">`;f.forEach(m=>{html+=`<div class="card" onclick="playM('${m.t.replace(/'/g,"")}','${m.id}','${m.c}')"><img src="${m.img}"><div class="info">${m.t}</div></div>`});html+=`</div></div>`;document.getElementById('categories').innerHTML=html;showHome();}
function playM(t,id,c){
 curr={t,id,c,data:DATA.find(x=>x.id===id)||{}};
 document.getElementById('pTitle').innerText=t;
 document.getElementById('player').style.display='flex';
 document.getElementById('status').innerText='Status: Loading Server 1 vidlink.pro... (Works in Uganda)';
 let providers=getProviders(curr);
 document.getElementById('pFrame').src=providers[0];
 document.querySelectorAll('#provBar .tab').forEach((b,i)=>b.classList.toggle('active',i===0));
 // Auto fallback if fails after 5 sec
 setTimeout(()=>{
   let frame=document.getElementById('pFrame');
   try{
     if(!frame.contentWindow || frame.contentDocument && frame.contentDocument.body.innerHTML.includes('could not be found')){
       document.getElementById('status').innerText='Server 1 failed, trying Server 2...';
       switchProv(1,document.querySelectorAll('#provBar .tab')[1]);
     }
   }catch(e){}
 },4000);
}
function switchProv(i,btn){
 if(!curr)return;
 let providers=getProviders(curr);
 document.getElementById('pFrame').src=providers[i];
 document.getElementById('status').innerText='Status: Playing on Server '+(i+1)+' - '+(i===0?'vidlink.pro (UG Best)':i===1?'vidsrc.cc':'embed.su');
 document.querySelectorAll('#provBar .tab').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
}
function closeP(){document.getElementById('player').style.display='none';document.getElementById('pFrame').src='about:blank';}
function setQual(q,btn){curQual=q;document.getElementById('qualLabel').innerText=q;if((q==='720p'||q==='1080p')&&!isPremium){document.getElementById('premiumModal').style.display='flex';}}
function downloadQuality(){if(!curr)return;if((curQual==='720p'||curQual==='1080p')&&!isPremium){document.getElementById('premiumModal').style.display='flex';return;}let dl={t:curr.t,id:curr.id,qual:curQual,size:curQual==='1080p'?'1.4GB':'1GB',progress:100,img:curr.data.img||'',status:'Saved'};downloads.unshift(dl);localStorage.setItem('raxtes_dls',JSON.stringify(downloads));window.open(getProviders(curr)[2],'_blank');alert('⬇ Opening download page (embed.su has download button inside player). Also saved to Downloads list.');renderDownloads();showDownloads();}
function renderDownloads(){document.getElementById('dlCount').innerText=downloads.length;document.getElementById('dlList').innerHTML=downloads.map(d=>`<div class="dlItem"><img src="${d.img}" style="width:90px;height:55px;border-radius:8px;object-fit:cover" onerror="this.src='https://via.placeholder.com/90x55'"><div style="flex:1"><div style="font-size:12px;font-weight:900">${d.qual.toUpperCase()} ${d.t}</div><div style="font-size:10px;color:#888">${d.size} • ${d.status}</div><div style="height:4px;background:#0a0e1a;border-radius:4px;margin-top:6px"><div style="height:100%;background:linear-gradient(90deg,#00e676,#00c853);width:100%"></div></div></div><button style="background:linear-gradient(90deg,#00e676,#00e5ff);color:#000;border:none;padding:8px 18px;border-radius:20px;font-weight:900" onclick="playM('${d.t.replace(/'/g,"")}','${d.id}','movie')">Play</button></div>`).join('')||'<div style="text-align:center;padding:40px;color:#888">No downloads yet<br>Go Home → Tap movie → Download</div>';}
function payNow(){let e=document.getElementById('subEmail').value;if(!e){alert('Enter email');return;}isPremium=true;localStorage.setItem('raxtes_premium','yes');document.getElementById('premiumModal').style.display='none';alert('Premium Active! 720p-1080p unlocked');}
function doSearch(){let q=document.getElementById('search').value.toLowerCase();if(!q){renderHome();return;}let f=DATA.filter(m=>m.t.toLowerCase().includes(q));let html=`<div class="cat"><div class="catHead"><h3>Search ${q}</h3></div><div class="hScroll">`;f.forEach(m=>{html+=`<div class="card" onclick="playM('${m.t.replace(/'/g,"")}','${m.id}','${m.c}')"><img src="${m.img}"><div class="info">${m.t}</div></div>`});html+=`</div></div>`;document.getElementById('categories').innerHTML=html;}
function shareMovie(){if(curr) alert('Share: '+curr.t);}
renderHome();renderDownloads();showHome();
</script></body></html>
